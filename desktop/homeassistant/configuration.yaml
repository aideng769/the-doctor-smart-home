# MANUAL EDIT: "your_camera" below (both the action name and the URL path)
# must match the same camera name used in config.yml / go2rtc.yaml / automations.yaml.
rest_command:
  frigate_clip_your_camera:
    url: "http://frigate:8971/api/export/your_camera/start/{{ (now().timestamp() - 30) | int }}/end/{{ (now().timestamp() - 10) | int }}"
    method: POST
    payload: '{"name": "manual_clip_{{ now().strftime(''%Y%m%d_%H%M%S'') }}"}'
    content_type: "application/json"
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
